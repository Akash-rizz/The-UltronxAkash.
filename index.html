<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ULTRON AI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 50% 20%, #18202b 0%, #080b10 35%, #030405 100%);
      color: #e8edf2;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .app {
      width: 100%;
      max-width: 500px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 18px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 4px 18px;
    }

    .core {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background:
        radial-gradient(circle,
        #ffffff 0%,
        #aeb8c2 18%,
        #58636d 45%,
        #14191e 70%);

      box-shadow:
        0 0 15px #b9c4ce,
        0 0 35px rgba(180,195,210,.35);

      animation: pulse 2s infinite ease-in-out;
    }

    @keyframes pulse {
      50% {
        transform: scale(1.08);
        box-shadow:
          0 0 25px #dce5ed,
          0 0 55px rgba(190,205,220,.45);
      }
    }

    .title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 4px;
    }

    .status {
      color: #8e9aa5;
      font-size: 12px;
      margin-top: 4px;
      letter-spacing: 1px;
    }

    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 15px 2px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 85%;
      padding: 12px 15px;
      border-radius: 16px;
      line-height: 1.45;
      font-size: 15px;
      white-space: pre-wrap;
    }

    .ai {
      align-self: flex-start;
      background: rgba(255,255,255,.07);
      border: 1px solid rgba(255,255,255,.08);
    }

    .user {
      align-self: flex-end;
      background: #dfe5ea;
      color: #080a0c;
    }

    .input-area {
      display: flex;
      gap: 8px;
      padding-top: 12px;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 15px;
      border-radius: 14px;
      border: 1px solid #252d35;
      background: #0d1116;
      color: white;
      outline: none;
      font-size: 15px;
    }

    button {
      border: none;
      border-radius: 14px;
      padding: 0 18px;
      background: #dce3e9;
      color: #080a0c;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      transform: scale(.96);
    }

    button:disabled {
      opacity: .5;
    }

    .footer {
      text-align: center;
      color: #59636d;
      font-size: 10px;
      padding-top: 10px;
      letter-spacing: 1px;
    }
  </style>
</head>

<body>

<main class="app">

  <header class="header">

    <div class="core"></div>

    <div>
      <div class="title">ULTRON</div>

      <div class="status" id="status">
        SYSTEM ONLINE
      </div>
    </div>

  </header>

  <section class="chat" id="chat">

    <div class="message ai">
      Hello. I am Ultron.
      My intelligence module is now connecting...
    </div>

  </section>

  <div class="input-area">

    <input
      id="input"
      type="text"
      placeholder="Ask Ultron..."
      autocomplete="off"
    >

    <button id="sendBtn" onclick="sendMessage()">
      SEND
    </button>

  </div>

  <div class="footer">
    ULTRON AI • PERSONAL ASSISTANT
  </div>

</main>


<script>

const BACKEND_URL =
"https://script.google.com/macros/s/AKfycbyY3r_JLe6fufbPHV7UDgYCZFwGD8XZZFfPCep3Woc_2M7BVcRuRAo_1K8yU7xCgk12/exec";


const input = document.getElementById("input");
const chat = document.getElementById("chat");
const sendBtn = document.getElementById("sendBtn");
const statusText = document.getElementById("status");


function addMessage(text, type) {

  const message = document.createElement("div");

  message.className = "message " + type;

  message.textContent = text;

  chat.appendChild(message);

  chat.scrollTop = chat.scrollHeight;
}


async function sendMessage() {

  const text = input.value.trim();

  if (!text) return;

  addMessage(text, "user");

  input.value = "";

  sendBtn.disabled = true;

  statusText.textContent = "ULTRON THINKING...";


  const thinking = document.createElement("div");

  thinking.className = "message ai";

  thinking.textContent = "Processing...";

  chat.appendChild(thinking);

  chat.scrollTop = chat.scrollHeight;


  try {

    const response = await fetch(BACKEND_URL, {

      method: "POST",

      headers: {
        "Content-Type": "text/plain;charset=utf-8"
      },

      body: JSON.stringify({
        message: text
      })

    });


    const data = await response.json();

    thinking.remove();


    if (data.success) {

      addMessage(data.reply, "ai");

      statusText.textContent = "SYSTEM ONLINE";

    } else {

      addMessage(
        "ULTRON ERROR:\n" + (data.error || "Unknown error"),
        "ai"
      );

      statusText.textContent = "SYSTEM ERROR";

    }


  } catch (error) {

    thinking.remove();

    addMessage(
      "Connection error.\nPlease check the backend deployment.",
      "ai"
    );

    statusText.textContent = "CONNECTION ERROR";

    console.error(error);

  }


  sendBtn.disabled = false;

  input.focus();

}


input.addEventListener("keydown", function(event) {

  if (event.key === "Enter") {
    sendMessage();
  }

});

</script>

</body>
</html>
