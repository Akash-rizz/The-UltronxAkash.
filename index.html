<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ULTRON TEST</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #050505;
      color: white;
      font-family: Arial;
      display: flex;
      flex-direction: column;
    }

    #chat {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
    }

    .bar {
      display: flex;
      gap: 8px;
      padding: 12px;
      background: #111;
      position: sticky;
      bottom: 0;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #555;
      background: #222;
      color: white;
      font-size: 16px;
    }

    button {
      padding: 0 18px;
      border: 0;
      border-radius: 10px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div id="chat">
    <h2>🤖 ULTRON</h2>
    <p>Frontend test is ONLINE.</p>
  </div>

  <div class="bar">
    <input id="input" placeholder="Type something...">
    <button onclick="test()">SEND</button>
  </div>

  <script>
    function test() {
      const input = document.getElementById("input");
      const chat = document.getElementById("chat");

      if (!input.value.trim()) return;

      const p = document.createElement("p");
      p.textContent = "YOU: " + input.value;

      chat.appendChild(p);

      input.value = "";
    }
  </script>

</body>
</html>
