<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ULTRON AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #05070a;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 18px;
      text-align: center;
      border-bottom: 1px solid #20252b;
      background: #090c10;
    }

    header h1 {
      margin: 0;
      letter-spacing: 5px;
      font-size: 25px;
    }

    #status {
      margin-top: 6px;
      font-size: 12px;
      color: #7f8a94;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      padding-bottom: 110px;
    }

    .msg {
      max-width: 85%;
      padding: 12px 15px;
      margin-bottom: 12px;
      border-radius: 15px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .ai {
      background: #151a20;
      border: 1px solid #252c33;
      margin-right: auto;
    }

    .user {
      background: #e2e7eb;
      color: #05070a;
      margin-left: auto;
    }

    .input-area {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;

      display: flex;
      gap: 8px;

      padding: 12px;
      background: #090c10;
      border-top: 1px solid #20252b;
    }

    #input {
      flex: 1;
      min-width: 0;

      padding: 14px;
      border-radius: 12px;
      border: 1px solid #303840;

      background: #151a20;
      color: white;

      font-size: 16px;
      outline: none;
    }

    #send {
      padding: 0 18px;

      border: none;
      border-radius: 12px;

      background: #e2e7eb;
      color: #05070a;

      font-weight: bold;
      font-size: 14px;
    }

    #send:disabled {
      opacity: 0.5;
    }
  </style>
</head>

<body>

<header>
  <h1>ULTRON</h1>
  <div id="status">SYSTEM ONLINE</div>
</header>

<div id="chat">

  <div class="msg ai">
    Hello. I am Ultron.
    Ask me anything.
  </div>

</div>

<div class="input-area">

  <input
    id="input"
    type="text"
    placeholder="Talk to Ultron..."
    autocomplete="off"
  >

  <button id="send">SEND</button>

</div>


<script>

const BACKEND_URL =
"https://script.google.com/macros/s/AKfycbyY3r_JLe6fufbPHV7UDgYCZFwGD8XZZFfPCep3Woc_2M7BVcRuRAo_1K8yU7xCgk12/exec";

const input = document.getElementById("input");
const send = document.getElementById("send");
const chat = document.getElementById("chat");
const status = document.getElementById("status");


function addMessage(text, type) {

  const div = document.createElement("div");

  div.className = "msg " + type;

  div.textContent = text;

  chat.appendChild(div);

  chat.scrollTop = chat.scrollHeight;

  return div;
}


async function sendMessage() {

  const text = input.value.trim();

  if (!text) return;

  addMessage(text, "user");

  input.value = "";

  send.disabled = true;

  status.textContent = "ULTRON THINKING...";

  const thinking = addMessage(
    "Thinking...",
    "ai"
  );


  try {

    const response = await fetch(
      BACKEND_URL,
      {
        method: "POST",

        headers: {
          "Content-Type": "text/plain;charset=utf-8"
        },

        body: JSON.stringify({
          message: text
        })
      }
    );


    const raw = await response.text();

    console.log("Backend response:", raw);

    let data;

    try {
      data = JSON.parse(raw);
    } catch {

      thinking.textContent =
        "Backend returned an unexpected response:\n\n" +
        raw;

      status.textContent = "BACKEND ERROR";

      send.disabled = false;

      return;
    }


    thinking.remove();


    if (data.success) {

      addMessage(
        data.reply,
        "ai"
      );

      status.textContent =
        "SYSTEM ONLINE";

    } else {

      addMessage(
        "ULTRON ERROR:\n" +
        (data.error || "Unknown error"),
        "ai"
      );

      status.textContent =
        "AI ERROR";
    }


  } catch (error) {

    thinking.remove();

    addMessage(
      "CONNECTION ERROR:\n" +
      error.message,
      "ai"
    );

    status.textContent =
      "CONNECTION FAILED";

  }


  send.disabled = false;

  input.focus();

}


send.addEventListener(
  "click",
  sendMessage
);


input.addEventListener(
  "keydown",
  function(event) {

    if (event.key === "Enter") {
      sendMessage();
    }

  }
);

</script>

</body>
</html>
